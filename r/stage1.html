<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>ステージ１</title>
  <style>
    .story-box {
      position: fixed;
      left: 5%;
      right: 5%;
      bottom: 4vh;

      height: 24vh;

      background: rgba(0, 0, 0, 0.82);

      border: 3px solid white;
      outline: 1px solid #777;
      outline-offset: -8px;

      border-radius: 12px;
      box-shadow:
        0 0 0 4px #222,
        0 0 0 6px #777,
        0 8px 20px rgba(0, 0, 0, 0.4);
      
      display: flex;

      padding: 24px;
      box-sizing: border-box;
    }
    .story {
      position: absolute;
      
      opacity: 0;
      transition: opacity 0.3s ease;

      font-family: "Yu Mincho", "Hiragino Kaku Gothic ProN", sans-serif;

      font-size:28px;
      line-height:2.2;
      text-align: left;
      color: white;
    }
    .story.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="story-box">
    
   <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>
    
  </div>
</body>
<script>
  function typeText(element, speed = 50) {
    const text = element.textContent;
    element.textContent = "";

    let i = 0;

    const timer = setInterval(() => {
      element.textContent += text[i];
      i++;

      if (i >= text.length) {
        clearInterval(timer);
      }
    }, speed);
  }

  const stories = document.querySelectorAll(".story");
  let index = 0;

  //最初のセリフ
  stories[index].classList.add("active");
  typeText(stories[index].querySelector("p"));

  document.addEventListener("click", () => {
    stories[index].classList.remove("active");

    index++;

    if(index < stories.length) {
      setTimeout(() => {
        stories[index].classList.add("active");
        //次のセリフ
        typeText(stories[index].querySelector("p"));

      }, 1000);
    }
  });
</script>
</html>
