<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>ステージ１</title>
  <style>
    .story-box {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;
    }
    .story {
      position: absolute;
      
      opacity: 0;
      transition: opacity 0.3s ease;

      font-family: "Yu Gothic", "Hiragino Kaku Gothic", sans-serif;

      font-size: 32px;
      text-align: center;
    }
    .story.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="story-box">
    
   <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>
    
  </div>
</body>
<script>
  const stories = document.querySelectorAll(".story")
  let index = 0;

  stories[index].classList.add("active")

  document.addEventListener("click", () => {
    stories[index].classList.remove("active");

    index++;

    if (index < stories.length) {
      setTimeout(() => {
       stories[index].classList.add("active");
      }, 1000);
    }
  });
</script>
</html>
