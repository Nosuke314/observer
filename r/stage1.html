<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>ステージ１</title>
  <style>
    .story-box {
      position: fixed;
      left: 5%;
      right: 5%;
      bottom: 4vh;

      height: 24vh;

      background: rgba(0, 0, 0, 0.82)

      display: flex;
      justify-content: center;
      align-items: center;
    }
    .story {
      position: absolute;
      
      opacity: 0;
      transition: opacity 0.3s ease;

      font-family: "Yu Mincho", sans-serif;

      font-size: 32px;
      text-align: center;
    }
    .story.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="story-box">
    
   <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>

    <div class="story">
    <p>テスト</p>
   </div>
    
  </div>
</body>
<script>
  const stories = document.querySelectorAll(".story")
  let index = 0;

  stories[index].classList.add("active")

  document.addEventListener("click", () => {
    stories[index].classList.remove("active");

    index++;

    if (index < stories.length) {
      setTimeout(() => {
       stories[index].classList.add("active");
      }, 1000);
    }
  });
</script>
</html>
