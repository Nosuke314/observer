<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>ステージ１</title>
  <style>
    .story {
      display: none;
    }
    .story.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="story">
   <p>テスト</p>
  </div>
</body>
<script>
  const story = document.querySelectorAll(".story")
  let index = 0;

  stories[index].classList.add("active")

  document.addEventListener("ckick", () => {
    stories[index].classList.remove("active");

    index++;

    if (index < stories.length) {
      stories[index].classList.add("active");
    }
  });
</script>
</html>
