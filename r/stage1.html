<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>ステージ１</title>
  <style>
    .story-box {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;
    }
    .story {
      opacity: 0;
      transition: opacity 1s ease;

      font-size: 32px;
      text-align: center;
    }
    .story.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="story">
   <p>テスト</p>
  </div>
</body>
<script>
  const story = document.querySelectorAll(".story")
  let index = 0;

  stories[index].classList.add("active")

  document.addEventListener("ckick", () => {
    stories[index].classList.remove("active");

    index++;

    if (index < stories.length) {
      stories[index].classList.add("active");
    }
  });
</script>
</html>
