<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>OBSERVER</title>
        <link rel="stylesheet" href="title.css">
    </head>
    <body>
        <div id="start">
            <img src="パスを挿入" alt="読み込み直してください">
             <button class="start-button">start</button>
             <p>予想プレイ時間は３～４時間です。<br>
             ソースコードの閲覧はネタバレにつながります。<br>
             不具合・バグが見つかり次第、Xアカウント＠nazonosuke314まで連絡してください。</p>
        </div>
        <div id="story">
        </div>
    </body>
    <script>
        const button = document.querySelector(".start-button");

        button.onclick = () => {
        document.getElementById("start").style.display = "none";
        document.getElementById("story").style.display = "block";
        }
        //ここまでスタート画面

        //セリフの一覧
        const lines = [
            "しりとり",
            "りんご",
            "ごりら"
        ];

        //セリフの順番カウンター
        let index = 0;

        //テキスト表示
        const story = document.getElementById("story");

        function showText() {

            const newLine = document.createElement("div");
            newLine.textContent = lines[index];

            newLine.classList.add("line");

            story.appendChild(newLine);

            setTimeout(() => {
                newLine.classList.add("show");
            }, 50);
        }

        //最初の表示
        showText();

        //クリックで進む
        document.addEventListener("click",() => {
            nextLine();
        });

        function nextLine() {
            index++;

            //カウンターが最後まで行ったときにストップ
            if(index >= lines.length) {
                index = lines.length - 1;
                return;
            }

            showText();
         }
    </script>
</html>
