<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>OBSERVER</title>
        <link rel="stylesheet" href="title.css">
    </head>
    <body>
        <div id="start">
            <img src="無題313_20260519223348.png" alt="読み込み直してください" class="logo">

                <div class="wakiyaku">
                    <img src="無題314_20260519224151.png" class="start-button">
                    <p>予想プレイ時間は３～４時間です。<br>
                    ソースコードの閲覧はネタバレにつながります。<br>
                    不具合・バグが見つかり次第、Xアカウント＠nazonosuke314まで連絡してください。</p>
                </div>
        </div>
        <div id="story">
        </div>
    </body>
    <script>
        const button = document.querySelector(".start-button");

        button.onclick = () => {
        document.getElementById("start").style.display = "none";
        document.getElementById("story").style.display = "block";
        }
        //ここまでスタート画面

        //セリフの一覧
        const lines = [
            "  ",
            "、、、",
            "ここは、、、？"
            "「お目覚めのようだね」"
            "誰？"
            "「怪しいものじゃない。この世界の管理人さ。」"
            "管理人？世界の？どういうこと？"
            "「随分と混乱されているようだな。落ち着いて聞いてほしい。君は別の世界からこの世界に転移されてきたんだ。」"
            "一体何が起きているんだ？"
            "「君はこの世界を救うために呼び出された。その素質を認められたのさ。」"
            "そんな、ファンタジーじゃあるまいし。"
            "「でも現に君はここにいる。簡単なことさ。この世界を救ってくれ。そしたら帰してやる。」"
            "うーん、よくわからないけど頑張るよ。でも最近筋トレさぼってるから力不足だよ。"
            "「安心してほしい。君の目的は魔王討伐なんかじゃない。ただ街の困りごとを聞いてやってほしいんだ。」"
            "そんなんでいいんだ。ならなんとかなりそうだ。"
            "「この世界には四つの街がある。周りを見てごらん。」"
            "扉、、、？街につながってるの？"
            "「ご名答。これはワープゲートなのさ。四つの街につながっている。」"
            "どの街に行けばいいの？"
            "「実はそれぞれの街で厄介なことが立て続けに起こったみたいでね。全部まわってやってくれないか。」"
            "骨が折れるなぁ。でも、元の世界に帰るためにがんばらなくちゃ。"
        ];

        //セリフの順番カウンター
        let index = 0;

        //テキスト表示
        const story = document.getElementById("story");

        function showText() {

            story.classList.add("show");
            
            const newLine = document.createElement("div");
            newLine.textContent = lines[index];

            newLine.classList.add("line");

            story.appendChild(newLine);

            setTimeout(() => {
                newLine.classList.add("show");
            }, 50);
        }

        //最初の表示
        showText();

        //クリックで進む
        document.addEventListener("click",() => {
            nextLine();
        });

        function nextLine() {
            index++;

            //カウンターが最後まで行ったときにストップ
            if(index >= lines.length) {
                window.location.href = "stage-select.html"; //ここに遷移先のファイルパスを挿入
                return;
            }

            showText();
         }
    </script>
</html>
